<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>姿勢カメラ V7</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #101418; color: #eef2f5; }
  main { max-width: 560px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 20px; margin: 6px 0 10px; }
  h2 { font-size: 15px; margin: 16px 0 6px; color: #9fb0bd; }
  .muted { color: #9fb0bd; font-size: 13px; }
  .err { color: #ff9a9a; font-size: 14px; }
  button { width: 100%; padding: 14px; margin: 6px 0; font-size: 16px; border-radius: 10px; border: 1px solid #3a4754; background: #232e39; color: #eef2f5; }
  button.primary { background: #0f6fde; border-color: #0f6fde; color: #fff; font-weight: bold; }
  button.sub { background: transparent; }
  button.danger { background: #7a2020; border-color: #7a2020; color: #fff; }
  button:disabled { opacity: .45; }
  input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #3a4754; background: #0d1116; color: #eef2f5; margin: 6px 0; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #2c3844; font-size: 12px; }
  .set-item { text-align: left; }
  #cam-wrap { position: fixed; inset: 0; background: #000; z-index: 20; }
  #cam-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cam-top { position: absolute; top: 0; left: 0; right: 0; padding: 10px 12px; background: linear-gradient(rgba(0,0,0,.65), transparent); z-index: 2; }
  #cam-dir { font-size: 22px; font-weight: bold; }
  #cam-info { font-size: 13px; color: #cfe0ee; margin-top: 2px; }
  #cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,.7)); z-index: 2; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 5px solid #0f6fde; margin: 0 auto; display: block; }
  #shutter:active { background: #bcd8ff; }
  .cam-btns { display: flex; gap: 8px; margin-top: 10px; }
  .cam-btns button { padding: 10px; font-size: 14px; }
  .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .thumbs figure { margin: 0; }
  .thumbs figcaption { font-size: 12px; color: #9fb0bd; margin-top: 4px; line-height: 1.5; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0f6fde; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; display: none; white-space: nowrap; }
</style>
</head>
<body>

<main id="page-top">
  <h1>姿勢カメラ V7</h1>
  <button id="btn-perms" class="primary">カメラとセンサーの権限を取る</button>
  <p class="muted">カメラ：<span id="perm-cam">未取得</span>　センサー：<span id="perm-sensor">未取得</span></p>
  <h2>患者の登録</h2>
  <p class="muted">現在の患者：<b id="current-patient">未登録</b></p>
  <button id="btn-ocr" disabled>カルテを撮って読み取る</button>
  <input id="reg-name" type="text" placeholder="患者名">
  <input id="reg-chart" type="text" placeholder="カルテ番号">
  <div id="patient-list"></div>
  <button id="btn-start-before" class="primary" disabled>ビフォーを撮る</button>
  <div id="after-area"></div>
  <h2>記録</h2>
  <div id="set-list"></div>
  <p id="list-empty" class="muted">まだありません</p>
  <h2>アプリの更新</h2>
  <button id="btn-update" class="sub">最新版に変更（キャッシュを避けて再読み込み）</button>
  <p id="upd-msg" class="muted"></p>
</main>

<main id="page-detail" hidden>
  <button id="btn-back-top" class="sub">← 戻る</button>
  <h1 id="detail-title">記録</h1>
  <p id="pitch-note" class="err" hidden></p>
  <div class="thumbs" id="detail-thumbs"></div>
  <button id="btn-export-json">記録データ（傾き・輪郭）を書き出す</button>
  <button id="btn-delete-set" class="danger">この記録を削除する</button>
</main>

<div id="cam-wrap" hidden>
  <canvas id="cam-canvas"></canvas>
  <div id="cam-top">
    <div id="cam-dir">正面</div>
    <div id="cam-info"></div>
  </div>
  <div id="cam-bottom">
    <button id="shutter" aria-label="撮影"></button>
    <div class="cam-btns">
      <button id="btn-cam-cancel" class="sub">やめる</button>
      <button id="btn-cam-skip" class="sub">撮らない</button>
      <button id="btn-cam-finish" class="sub">ここまでで保存</button>
      <button id="btn-cam-flip" class="sub">カメラ切替</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const APP_VERSION = 7;
const DIRS = ["front", "right", "left", "back"];
const DIR_JA = { front: "正面", right: "右側面", left: "左側面", back: "背面" };
const $ = (id) => document.getElementById(id);
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._h); toast._h = setTimeout(() => { t.style.display = "none"; }, ms || 1800);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ===== 保存 ===== */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("posture-cam", 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains("sets")) d.createObjectStore("sets", { keyPath: "id" });
        if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos", { keyPath: "id" }).createIndex("setId", "setId", { unique: false });
        if (!d.objectStoreNames.contains("patients")) d.createObjectStore("patients", { keyPath: "id" });
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  put(store, v) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, "readwrite");
      t.objectStore(store).put(v);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  },
  get(store, k) {
    return new Promise((res, rej) => {
      const rq = DB.db.transaction(store).objectStore(store).get(k);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error);
    });
  },
  all(store) {
    return new Promise((res, rej) => {
      const rq = DB.db.transaction(store).objectStore(store).getAll();
      rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
    });
  },
  bySet(setId) {
    return new Promise((res, rej) => {
      const rq = DB.db.transaction("photos").objectStore("photos").index("setId").getAll(setId);
      rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
    });
  },
  del(store, k) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, "readwrite");
      t.objectStore(store).delete(k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  }
};

/* ===== 傾き ===== */
let orient = { alpha: null, beta: null, gamma: null };
let gotOrientValue = false;
function onOrient(e) {
  orient = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
  if (e.beta != null) gotOrientValue = true;
}
function tiltDeg(o) {
  if (o.beta == null || o.gamma == null) return null;
  const b = o.beta * Math.PI / 180, g = o.gamma * Math.PI / 180;
  return Math.round(Math.atan2(-Math.cos(b) * Math.sin(g), Math.sin(b)) * 180 / Math.PI * 10) / 10;
}
function pitchDeg(o) {
  if (o.beta == null) return null;
  return Math.round((o.beta - 90) * 10) / 10;
}
let sensorAsked = false;
/* iOS対策：モーションセンサーの許可要求は、タップされた瞬間に直接呼ばないと
   受け付けられないことがある。そのため要求だけを同期的に発行し、Promiseを返す。 */
function requestSensorPermission() {
  if (sensorAsked) return Promise.resolve(true);
  sensorAsked = true;
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    return DeviceOrientationEvent.requestPermission()
      .then((p) => p === "granted")
      .catch(() => false);
  }
  return Promise.resolve(true);
}
async function finishSensorSetup(granted) {
  if (!granted) return false;
  window.addEventListener("deviceorientation", onOrient, true);
  return true;
}

/* ===== 権限（最初に取る） ===== */
const PERMS = { cam: false, sensor: false };
function updatePermUI() {
  $("perm-cam").textContent = PERMS.cam ? "OK" : "未取得";
  $("perm-sensor").textContent = PERMS.sensor ? "OK" : "未取得";
  $("btn-ocr").disabled = !PERMS.cam;
  $("btn-start-before").disabled = !(PERMS.cam && currentPatient);
  $("btn-perms").disabled = PERMS.cam && PERMS.sensor;
}
async function takePerms() {
  // iOS対策：センサー許可の要求は、タップの最初に直接発行する（カメラより先）
  const sensorReq = requestSensorPermission();
  // カメラ：許可を取るだけ（ストリームはすぐ止める。撮影時に改めて開く）
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    st.getTracks().forEach((t) => t.stop());
    PERMS.cam = true;
  } catch (e) {
    console.warn(e);
    $("perm-cam").textContent = "許可されませんでした";
  }
  // モーションセンサー：許可＋値が実際に来るかまで確認
  const asked = await finishSensorSetup(await sensorReq);
  if (asked) {
    const t0 = Date.now();
    while (!gotOrientValue && Date.now() - t0 < 1500) {
      await new Promise((r) => setTimeout(r, 100));
    }
    PERMS.sensor = gotOrientValue;
    if (!PERMS.sensor) $("perm-sensor").textContent = "値が取れませんでした";
  } else {
    $("perm-sensor").textContent = "許可されませんでした";
  }
  updatePermUI();
  await renderList();
  if (PERMS.cam) toast("権限を取りました");
}
if (typeof DeviceOrientationEvent === "undefined" || typeof DeviceOrientationEvent.requestPermission !== "function") {
  window.addEventListener("deviceorientation", onOrient, true);
}

/* ===== 患者登録（OCR＋手入力） ===== */
let currentPatient = null;
async function renderPatients() {
  const ps = (await DB.all("patients")).sort((a, b) => b.createdAt - a.createdAt);
  const box = $("patient-list"); box.innerHTML = "";
  for (const p of ps) {
    const row = document.createElement("div");
    row.style.display = "flex"; row.style.gap = "8px"; row.style.margin = "6px 0";
    const b = document.createElement("button");
    b.className = "sub"; b.style.flex = "1";
    b.textContent = (currentPatient && currentPatient.id === p.id ? "● " : "") + p.name + "（No." + p.chartNo + "）";
    b.onclick = async () => { currentPatient = p; localStorage.setItem("pc-patient", p.id); await renderPatients(); };
    const del = document.createElement("button");
    del.className = "sub"; del.textContent = "削除";
    del.onclick = async () => {
      if (!confirm(p.name + "（No." + p.chartNo + "）を削除しますか？")) return;
      await DB.del("patients", p.id);
      if (currentPatient && currentPatient.id === p.id) {
        currentPatient = null;
        localStorage.removeItem("pc-patient");
      }
      await renderPatients();
    };
    row.appendChild(b); row.appendChild(del);
    box.appendChild(row);
  }
  updatePatientUI();
}
function updatePatientUI() {
  $("current-patient").textContent = currentPatient ? currentPatient.name + "（No." + currentPatient.chartNo + "）" : "未登録";
  updatePermUI();
  renderPatientsSelection();
}
function renderPatientsSelection() {
  // 選択中マークだけ付け直す（再描画は renderPatients が担う）
}
async function registerPatient() {
  const name = $("reg-name").value.trim();
  const chartNo = $("reg-chart").value.trim();
  if (!name || !chartNo) { toast("名前とカルテ番号を入れてください"); return; }
  const all = await DB.all("patients");
  let p = all.find((x) => x.chartNo === chartNo);
  if (p) { p.name = name; }
  else { p = { id: uid(), name, chartNo, createdAt: Date.now() }; }
  await DB.put("patients", p);
  currentPatient = p;
  localStorage.setItem("pc-patient", p.id);
  $("reg-name").value = "";
  $("reg-chart").value = "";
  await renderPatients();
  toast("登録しました");
}

/* カルテ撮影→OCR。読み取りは端末内（Tesseract）で行う。名前と番号が揃えば、そのまま登録する（V7で登録ボタンを廃止）。 */
let tesseractLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js";
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return tesseractLoading;
}
function parseChartText(text) {
  const lines = String(text).split(/\n/).map((l) => l.trim()).filter(Boolean);
  let chartNo = "";
  const m = text.match(/(?:No\.?|番号|カルテ|ID)[:：\s]*([0-9][0-9\-]{2,})/i);
  if (m) chartNo = m[1].replace(/-/g, "");
  if (!chartNo) {
    const nums = text.match(/[0-9]{4,}/g);
    if (nums) chartNo = nums.sort((a, b) => b.length - a.length)[0];
  }
  let name = "";
  const nm = text.match(/(?:氏名|名前|患者名)[:：\s]*([^\n\d]{2,})/);
  if (nm) name = nm[1].trim();
  if (!name) {
    const cand = lines.filter((l) => /[ぁ-んァ-ヶ一-龥]/.test(l) && !/(カルテ|番号|氏名|名前|患者|診療|歯科|医院|様式|No)/i.test(l))
      .sort((a, b) => b.length - a.length)[0];
    if (cand) name = cand.replace(/[\s　]+/g, "");
  }
  name = name.replace(/様$/, "").trim();
  return { name, chartNo };
}
async function runOcr(canvas) {
  toast("読み取っています…", 6000);
  try {
    await loadTesseract();
    const { data } = await window.Tesseract.recognize(canvas, "jpn");
    const r = parseChartText(data.text || "");
    if (r.name) $("reg-name").value = r.name;
    if (r.chartNo) $("reg-chart").value = r.chartNo;
    if (r.name && r.chartNo) {
      await registerPatient();
    } else {
      toast(r.name || r.chartNo ? "一部だけ読み取りました。足りない欄を入れてください" : "読み取れませんでした");
    }
  } catch (e) {
    console.warn(e);
    toast("読み取れませんでした");
  }
}

/* ===== AI（後から読み込む。失敗しても撮影はできる） ===== */
let MP = null, pose = null, seg = null, aiState = "";
async function loadAI() {
  if (MP) return;
  try {
    MP = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const vision = await MP.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    pose = await MP.PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate: "GPU" },
      runningMode: "VIDEO", numPoses: 1
    });
    seg = await MP.ImageSegmenter.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite", delegate: "GPU" },
      runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: false
    });
  } catch (e) { console.warn("AI読込:", e); aiState = "AIなし"; }
}

function contourFromMask(mask, w, h) {
  let cx = 0, cy = 0, n = 0;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
    if (mask[y * w + x] > 0) { cx += x; cy += y; n++; }
  }
  if (n < w * h * 0.02) return null;
  cx /= n; cy /= n;
  const RAYS = 180, pts = [];
  for (let i = 0; i < RAYS; i++) {
    const a = (i / RAYS) * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    let last = null;
    for (let r = 0; r < Math.max(w, h); r += 2) {
      const x = Math.round(cx + dx * r), y = Math.round(cy + dy * r);
      if (x < 0 || y < 0 || x >= w || y >= h) break;
      if (mask[y * w + x] > 0) last = [x / w, y / h];
    }
    if (last) pts.push(last);
  }
  if (pts.length < RAYS * 0.6) return null;
  return pts.map((p, i) => {
    const q = pts[(i + 1) % pts.length], r = pts[(i + pts.length - 1) % pts.length];
    return [(p[0] + q[0] + r[0]) / 3, (p[1] + q[1] + r[1]) / 3];
  });
}
async function extractContour(canvas) {
  if (!seg) return null;
  try {
    const sc = Math.min(1, 640 / canvas.width);
    const c = document.createElement("canvas");
    c.width = Math.round(canvas.width * sc); c.height = Math.round(canvas.height * sc);
    c.getContext("2d").drawImage(canvas, 0, 0, c.width, c.height);
    const result = seg.segment(c);
    if (!result || !result.categoryMask) return null;
    return contourFromMask(result.categoryMask.getAsUint8Array(), result.categoryMask.width, result.categoryMask.height);
  } catch (e) { console.warn("輪郭:", e); return null; }
}

/* ===== 撮影 ===== */
const S = {
  mode: null, patient: "", baseSetId: null, basePhotos: {},
  step: 0, shots: [], stream: null, video: null, raf: 0,
  landmarks: null, facing: "environment", busy: false
};
function coverTransform(vw, vh, cw, ch) {
  const s = Math.max(cw / vw, ch / vh);
  return { s, ox: (cw - vw * s) / 2, oy: (ch - vh * s) / 2 };
}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("no-camera-api");
  }
  S.video = document.createElement("video");
  S.video.playsInline = true; S.video.muted = true;
  S.stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: S.facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
  });
  S.video.srcObject = S.stream;
  await S.video.play();
  requestAnimationFrame(drawLoop);
}
function stopCamera() {
  cancelAnimationFrame(S.raf);
  if (S.stream) S.stream.getTracks().forEach((t) => t.stop());
  S.stream = null;
}
function drawLoop() {
  S.raf = requestAnimationFrame(drawLoop);
  const v = S.video, cv = $("cam-canvas");
  if (!v || v.readyState < 2) return;
  const cw = Math.round(cv.clientWidth * devicePixelRatio), ch = Math.round(cv.clientHeight * devicePixelRatio);
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
  const ctx = cv.getContext("2d");
  const vw = v.videoWidth, vh = v.videoHeight;
  const { s, ox, oy } = coverTransform(vw, vh, cw, ch);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(v, ox, oy, vw * s, vh * s);

  if (pose) {
    try {
      const r = pose.detectForVideo(v, performance.now());
      S.landmarks = (r && r.landmarks && r.landmarks[0]) || null;
    } catch (e) { S.landmarks = null; }
  }
  if (S.landmarks && MP) {
    ctx.strokeStyle = "rgba(64,200,255,.9)"; ctx.fillStyle = "rgba(255,220,64,.95)";
    ctx.lineWidth = Math.max(2, cw * 0.004);
    const P = (p) => [ox + p.x * vw * s, oy + p.y * vh * s];
    const CONN = MP.PoseLandmarker.POSE_CONNECTIONS ||
      [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[0,11],[0,12]].map(([a, b]) => ({ start: a, end: b }));
    ctx.beginPath();
    for (const c of CONN) {
      const a = S.landmarks[c.start], b = S.landmarks[c.end];
      if (!a || !b) continue;
      const [ax, ay] = P(a), [bx, by] = P(b);
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
    }
    ctx.stroke();
    for (const p of S.landmarks) {
      const [x, y] = P(p);
      ctx.beginPath(); ctx.arc(x, y, Math.max(2.5, cw * 0.005), 0, Math.PI * 2); ctx.fill();
    }
  }

  const base = S.mode === "after" ? S.basePhotos[DIRS[S.step]] : null;
  if (base && base.contour && base.contour.length > 2) {
    const bw = base.w || vw, bh = base.h || vh;
    const t2 = coverTransform(bw, bh, cw, ch);
    ctx.strokeStyle = "rgba(255,120,160,.95)";
    ctx.lineWidth = Math.max(2.5, cw * 0.006);
    ctx.beginPath();
    base.contour.forEach((p, i) => {
      const x = t2.ox + p[0] * bw * t2.s, y = t2.oy + p[1] * bh * t2.s;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath(); ctx.stroke();
  }

  const t = tiltDeg(orient);
  $("cam-info").textContent = "傾き " + (t == null ? "—" : t.toFixed(1) + "°") + (aiState ? "　" + aiState : "");
}

async function beginShoot(mode, baseSetId, patientObj) {
  if (!PERMS.cam) { toast("先に権限を取ってください"); return; }
  S.mode = mode; S.baseSetId = baseSetId || null;
  S.patientObj = patientObj || null;
  S.patient = patientObj ? patientObj.name : "";
  S.step = 0; S.shots = []; S.landmarks = null; S.basePhotos = {};
  if (mode === "after" && baseSetId) {
    const ps = await DB.bySet(baseSetId);
    for (const p of ps) S.basePhotos[p.dir] = p;
  }
  $("page-top").hidden = true; $("page-detail").hidden = true;
  $("cam-wrap").hidden = false;
  updateCamDir();
  try {
    await startCamera();
  } catch (e) {
    console.warn(e);
    toast("カメラを開けませんでした");
    cancelShoot();
    return;
  }
  loadAI();
}
function updateCamDir() {
  if (S.mode === "ocr") {
    $("cam-dir").textContent = "カルテの名前と番号を写す";
    $("btn-cam-finish").disabled = true;
    return;
  }
  $("cam-dir").textContent = (S.step + 1) + " / 4　" + DIR_JA[DIRS[S.step]] + (S.mode === "after" ? "（アフター）" : "（ビフォー）");
  $("btn-cam-finish").disabled = S.shots.length === 0;
}
function cancelShoot() {
  stopCamera();
  $("cam-wrap").hidden = true;
  $("page-top").hidden = false;
}
async function nextStep() {
  S.step++;
  if (S.step >= 4) { await finishShoot(); return; }
  updateCamDir();
}
async function takePhoto() {
  if (S.busy || !S.video || S.video.readyState < 2) return;
  S.busy = true;
  try {
    const v = S.video;
    const c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    if (S.mode === "ocr") {
      stopCamera();
      $("cam-wrap").hidden = true;
      $("page-top").hidden = false;
      await runOcr(c);
      return;
    }
    S.shots.push({
      dir: DIRS[S.step], canvas: c,
      tilt: tiltDeg(orient), pitch: pitchDeg(orient),
      alpha: orient.alpha, beta: orient.beta, gamma: orient.gamma
    });
    toast(DIR_JA[DIRS[S.step]] + "を撮りました");
    await nextStep();
  } finally { S.busy = false; }
}
async function finishShoot() {
  if (!S.shots.length) { cancelShoot(); return; }
  stopCamera();
  $("cam-wrap").hidden = true;
  toast("保存しています…", 4000);
  const setId = uid();
  await DB.put("sets", {
    id: setId,
    patientId: S.patientObj ? S.patientObj.id : null,
    patient: S.patient || "（名前なし）",
    chartNo: S.patientObj ? S.patientObj.chartNo : "",
    kind: S.mode,
    baseSetId: S.baseSetId, createdAt: Date.now(), appVersion: APP_VERSION
  });
  for (const shot of S.shots) {
    let contour = null;
    if (S.mode === "before") contour = await extractContour(shot.canvas);
    const blob = await new Promise((res) => shot.canvas.toBlob(res, "image/jpeg", 0.92));
    await DB.put("photos", {
      id: uid(), setId, dir: shot.dir, blob,
      w: shot.canvas.width, h: shot.canvas.height,
      tilt: shot.tilt, pitch: shot.pitch,
      alpha: shot.alpha, beta: shot.beta, gamma: shot.gamma, contour
    });
  }
  toast("保存しました");
  $("page-top").hidden = false;
  await renderList();
}

/* ===== 一覧・詳細 ===== */
let currentSet = null, currentPhotos = [];
async function renderList() {
  const sets = (await DB.all("sets")).sort((a, b) => b.createdAt - a.createdAt);
  const box = $("set-list"); box.innerHTML = "";
  $("list-empty").style.display = sets.length ? "none" : "";
  const area = $("after-area"); area.innerHTML = "";
  for (const s of sets) {
    const d = new Date(s.createdAt);
    const when = (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    const b = document.createElement("button");
    b.className = "set-item";
    b.innerHTML = "<b>" + escapeHtml(s.patient) + "</b>" + (s.chartNo ? "　<span class='muted'>No." + escapeHtml(s.chartNo) + "</span>" : "") + "　<span class='tag'>" + (s.kind === "before" ? "ビフォー" : "アフター") + "</span>　<span class='muted'>" + when + "</span>";
    b.onclick = () => openDetail(s.id);
    box.appendChild(b);
    if (s.kind === "before") {
      const ab = document.createElement("button");
      ab.textContent = "アフターを撮る（" + s.patient + "）";
      ab.disabled = !PERMS.cam;
      ab.onclick = () => beginShoot("after", s.id, { id: s.patientId, name: s.patient, chartNo: s.chartNo || "" });
      area.appendChild(ab);
    }
  }
}
function correctedCanvas(img, tilt) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const ang = -(tilt || 0) * Math.PI / 180;
  const t = Math.abs(ang), cos = Math.cos(t), sin = Math.sin(t);
  const rot = document.createElement("canvas");
  rot.width = Math.round(w * cos + h * sin); rot.height = Math.round(w * sin + h * cos);
  const rctx = rot.getContext("2d");
  rctx.translate(rot.width / 2, rot.height / 2); rctx.rotate(ang);
  rctx.drawImage(img, -w / 2, -h / 2);
  // 回転で生じる余白（隅の欠け）を切り落とし、中に収まる最大の長方形に整える
  let cw = w, ch = h;
  const det = cos * cos - sin * sin;
  if (sin > 0.0001 && det > 0.2) {
    const x = ((w / 2) * cos - (h / 2) * sin) / det;
    const y = ((h / 2) * cos - (w / 2) * sin) / det;
    if (x > 10 && y > 10) { cw = Math.floor(2 * x); ch = Math.floor(2 * y); }
  }
  const out = document.createElement("canvas");
  out.width = cw; out.height = ch;
  out.getContext("2d").drawImage(rot, (rot.width - cw) / 2, (rot.height - ch) / 2, cw, ch, 0, 0, cw, ch);
  return out;
}
function downloadBlob(blob, name) {
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function fileBase() {
  const d = new Date(currentSet.createdAt);
  return "posture_" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + "_" + currentSet.kind;
}
async function openDetail(setId) {
  currentSet = await DB.get("sets", setId);
  if (!currentSet) return;
  currentPhotos = (await DB.bySet(setId)).sort((a, b) => DIRS.indexOf(a.dir) - DIRS.indexOf(b.dir));
  $("page-top").hidden = true;
  $("page-detail").hidden = false;
  $("detail-title").textContent = currentSet.patient + (currentSet.chartNo ? "（No." + currentSet.chartNo + "）" : "") + "（" + (currentSet.kind === "before" ? "ビフォー" : "アフター") + "）";

  const note = $("pitch-note");
  note.hidden = true;
  if (currentSet.kind === "after" && currentSet.baseSetId) {
    const basePhotos = await DB.bySet(currentSet.baseSetId);
    const diffs = currentPhotos.filter((p) => {
      const b = basePhotos.find((x) => x.dir === p.dir);
      return b && p.pitch != null && b.pitch != null && Math.abs(p.pitch - b.pitch) >= 5;
    }).map((p) => DIR_JA[p.dir]);
    if (diffs.length) {
      note.textContent = "注意：上下の傾きがビフォーと違う写真があります（" + diffs.join("、") + "）";
      note.hidden = false;
    }
  }

  const box = $("detail-thumbs"); box.innerHTML = "";
  for (const p of currentPhotos) {
    const fig = document.createElement("figure");
    const url = URL.createObjectURL(p.blob);
    const img = new Image();
    img.onload = () => {
      const cv = correctedCanvas(img, p.tilt);
      cv.style.width = "100%"; cv.style.borderRadius = "8px"; cv.style.display = "block"; cv.style.background = "#000";
      fig.insertBefore(cv, fig.firstChild);
      URL.revokeObjectURL(url);
    };
    img.src = url;
    const cap = document.createElement("figcaption");
    cap.textContent = DIR_JA[p.dir] + "　傾き " + (p.tilt == null ? "—" : p.tilt.toFixed(1) + "°") +
      "　上下 " + (p.pitch == null ? "—" : p.pitch.toFixed(1) + "°") +
      (currentSet.kind === "before" ? (p.contour ? "　輪郭あり" : "　輪郭なし") : "");
    fig.appendChild(cap);
    const dl = document.createElement("button");
    dl.className = "sub"; dl.textContent = "書き出す（補正済み）";
    dl.onclick = () => {
      const img2 = new Image();
      const u2 = URL.createObjectURL(p.blob);
      img2.onload = () => {
        correctedCanvas(img2, p.tilt).toBlob((b2) => { downloadBlob(b2, fileBase() + "_" + p.dir + ".jpg"); URL.revokeObjectURL(u2); }, "image/jpeg", 0.92);
      };
      img2.src = u2;
    };
    fig.appendChild(dl);
    box.appendChild(fig);
  }
}

/* ===== 配線 ===== */
$("btn-perms").onclick = takePerms;
$("btn-ocr").onclick = async () => {
  if (!PERMS.cam) { toast("先に権限を取ってください"); return; }
  S.mode = "ocr"; S.step = 0; S.shots = [];
  $("page-top").hidden = true; $("page-detail").hidden = true;
  $("cam-wrap").hidden = false;
  updateCamDir();
  try { await startCamera(); } catch (e) { toast("カメラを開けませんでした"); cancelShoot(); }
};
$("btn-start-before").onclick = async () => {
  const nm = $("reg-name").value.trim(), cn = $("reg-chart").value.trim();
  if (nm && cn) await registerPatient();
  if (!currentPatient) { toast("患者が決まっていません"); return; }
  beginShoot("before", null, currentPatient);
};
$("shutter").onclick = takePhoto;
$("btn-cam-cancel").onclick = cancelShoot;
$("btn-cam-skip").onclick = () => { if (!S.busy) nextStep(); };
$("btn-cam-finish").onclick = () => { if (!S.busy) finishShoot(); };
$("btn-cam-flip").onclick = async () => {
  S.facing = S.facing === "environment" ? "user" : "environment";
  stopCamera();
  try { await startCamera(); } catch (e) { toast("切り替えられませんでした"); }
};
$("btn-back-top").onclick = () => { $("page-detail").hidden = true; $("page-top").hidden = false; };
$("btn-export-json").onclick = () => {
  if (!currentSet) return;
  const data = {
    patient: currentSet.patient, kind: currentSet.kind,
    createdAt: new Date(currentSet.createdAt).toISOString(),
    photos: currentPhotos.map((p) => ({ dir: p.dir, w: p.w, h: p.h, tilt: p.tilt, pitch: p.pitch, alpha: p.alpha, beta: p.beta, gamma: p.gamma, contour: p.contour }))
  };
  downloadBlob(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), fileBase() + "_data.json");
};
$("btn-delete-set").onclick = async () => {
  if (!currentSet || !confirm("削除しますか？")) return;
  for (const p of currentPhotos) await DB.del("photos", p.id);
  await DB.del("sets", currentSet.id);
  $("page-detail").hidden = true; $("page-top").hidden = false;
  await renderList();
};

/* ===== 更新確認（キャッシュを避けて最新版を開く。睡眠アプリと同じ仕組み） ===== */
const UPD_REPO = "matsuodentalassociation/camera";
const UPD_BRANCH = "main";
const UPD_FILE = "index.html";
const UPD_PAGES = "https://matsuodentalassociation.github.io/camera/";
const UPD_TARGET_KEY = "posturecam-update-target";
const UPDATE_EVERY_MS = 10 * 60 * 1000;
const UPD_TIMEOUT_MS = 10000;
const updState = { checking: false, applying: false, latest: null, sha: "", error: "", checkedAt: 0, userInitiated: false };
function updMsg(text) { const el = $("upd-msg"); if (el) el.textContent = text; }
function parseVersion(text) {
  const m = String(text || "").match(/const\s+APP_VERSION\s*=\s*(\d+)/);
  return m ? Number(m[1]) : null;
}
async function updFetch(url, timeoutMs) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs || UPD_TIMEOUT_MS);
  try { return await fetch(url, { cache: "no-store", signal: ctl.signal }); }
  finally { clearTimeout(timer); }
}
async function fetchLatestCommit() {
  const api = "https://api.github.com/repos/" + UPD_REPO + "/commits/" + UPD_BRANCH + "?_=" + Date.now();
  const res = await updFetch(api);
  if (!res.ok) throw new Error("GitHub API " + res.status);
  const data = await res.json();
  if (!data || !data.sha) throw new Error("最新コミットを取得できませんでした");
  return data;
}
async function fetchCommittedFile(sha) {
  const url = "https://raw.githubusercontent.com/" + UPD_REPO + "/" + sha + "/" + UPD_FILE;
  const res = await updFetch(url);
  if (!res.ok) throw new Error("最新版ファイルを取得できませんでした");
  return res.text();
}
async function fetchServedVersion() {
  const url = UPD_PAGES + "?updcheck=" + Date.now();
  const res = await updFetch(url, 15000);
  if (!res.ok) throw new Error("公開ページを確認できませんでした");
  return parseVersion(await res.text());
}
function renderUpdate() {
  const btn = $("btn-update");
  if (!btn) return;
  if (updState.applying) {
    btn.disabled = true;
    btn.textContent = "最新版へ切り替え中…";
    updMsg("キャッシュを消して、最新版を開き直しています。");
    return;
  }
  btn.disabled = false;
  if (updState.latest && updState.latest > APP_VERSION) {
    btn.textContent = "最新版 V" + updState.latest + " に変更（キャッシュを避けて再読み込み）";
    updMsg("新しい版 V" + updState.latest + " があります。今は V" + APP_VERSION + " です。");
  } else {
    btn.textContent = "最新版に変更（キャッシュを避けて再読み込み）";
    if (updState.error) updMsg(updState.error);
    else if (updState.checkedAt) updMsg("最新版を確認済みです（現在 V" + APP_VERSION + "）。");
    else updMsg("公開ページの最新版を確認します。");
  }
}
async function checkUpdate(userInitiated) {
  if (updState.checking || updState.applying) return;
  updState.checking = true;
  updState.userInitiated = !!userInitiated;
  updState.error = "";
  if (userInitiated) updMsg("最新版を確認しています…");
  try {
    const commit = await fetchLatestCommit();
    const latest = parseVersion(await fetchCommittedFile(commit.sha));
    if (!latest) throw new Error("最新版の番号を確認できませんでした");
    updState.latest = latest;
    updState.sha = commit.sha;
    updState.checkedAt = Date.now();
    if (latest > APP_VERSION) {
      if (userInitiated) await applyLatest();
    } else if (userInitiated) {
      updMsg("いま開いているのが最新版です（V" + APP_VERSION + "）。");
    }
  } catch (e) {
    console.error(e);
    updState.error = userInitiated ? "最新版を確認できませんでした。通信状態を確認して、もう一度押してください。" : "";
  } finally {
    updState.checking = false;
    if (!updState.applying) renderUpdate();
  }
}
async function applyLatest() {
  if (updState.applying) return;
  if (S.stream || S.busy) { updMsg("撮影中は切り替えられません。撮影を終えてから押してください。"); return; }
  updState.applying = true;
  renderUpdate();
  try {
    const latest = updState.latest;
    const sha = updState.sha || (await fetchLatestCommit()).sha;
    let served = null;
    for (let i = 0; i < 6; i++) {
      served = await fetchServedVersion().catch(() => null);
      if (served && served >= latest) break;
      if (i < 5) await new Promise((r) => setTimeout(r, 5000));
    }
    if (!served || served < latest) {
      updState.applying = false;
      updMsg("新しい版はまだ公開ページへ反映されていません。少し待ってから、もう一度押してください。");
      renderUpdate();
      return;
    }
    try { sessionStorage.setItem(UPD_TARGET_KEY, JSON.stringify({ version: latest, sha, at: Date.now() })); } catch (e) {}
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    const url = new URL(location.href);
    url.searchParams.set("v", String(latest));
    url.searchParams.set("c", String(sha).slice(0, 12));
    url.searchParams.set("t", String(Date.now()));
    location.replace(url.toString());
  } catch (e) {
    console.error(e);
    updState.applying = false;
    updMsg("切り替えに失敗しました。もう一度押してください。");
    renderUpdate();
  }
}
$("btn-update").onclick = () => { checkUpdate(true); };

(async () => {
  await DB.open();
  const savedId = localStorage.getItem("pc-patient");
  if (savedId) currentPatient = await DB.get("patients", savedId);
  await renderPatients();
  updatePermUI();
  await renderList();
  renderUpdate();
  checkUpdate(false);
  setInterval(() => { checkUpdate(false); }, UPDATE_EVERY_MS);
})();
