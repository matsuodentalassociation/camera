<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>姿勢カメラ V25</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #101418; color: #eef2f5; -webkit-user-select: none; user-select: none; }
  input { -webkit-user-select: text; user-select: text; }
  main { max-width: 560px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 20px; margin: 6px 0 10px; }
  h2 { font-size: 15px; margin: 16px 0 6px; color: #9fb0bd; }
  .muted { color: #9fb0bd; font-size: 13px; }
  .err { color: #ff9a9a; font-size: 14px; }
  button { width: 100%; padding: 10px; margin: 5px 0; font-size: 14px; border-radius: 8px; border: 1px solid #3a4754; background: #232e39; color: #eef2f5; }
  button.primary { background: #0f6fde; border-color: #0f6fde; color: #fff; font-weight: bold; padding: 14px; font-size: 16px; }
  button.sub { background: transparent; width: auto; padding: 7px 12px; font-size: 13px; margin: 4px 0; }
  button.danger { background: #7a2020; border-color: #7a2020; color: #fff; }
  button:disabled { opacity: .45; }
  input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #3a4754; background: #0d1116; color: #eef2f5; margin: 6px 0; }
  .fld-label { display: block; font-size: 12px; color: #9fb0bd; margin: 10px 0 0; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #2c3844; font-size: 12px; }
  .set-item { text-align: left; }
  #cam-wrap { position: fixed; inset: 0; background: #000; z-index: 20; }
  #cam-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cam-top { position: absolute; top: 0; left: 0; right: 0; padding: 10px 12px; background: linear-gradient(rgba(0,0,0,.65), transparent); z-index: 2; }
  #cam-dir { font-size: 22px; font-weight: bold; }
  #cam-info { font-size: 13px; color: #cfe0ee; margin-top: 2px; }
  #cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,.7)); z-index: 2; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; background: #fff; border: 5px solid #0f6fde; margin: 0 auto; display: block; }
  #shutter:active { background: #bcd8ff; }
  .cam-btns { display: flex; gap: 8px; margin-top: 10px; }
  .cam-btns button { padding: 10px; font-size: 14px; flex: 1 1 0; }
  .row-label { font-size: 13px; color: #9fb0bd; margin: 12px 0 2px; }
  .frame-row { display: flex; gap: 6px; margin: 4px 0 8px; }
  .frame { flex: 1 1 0; aspect-ratio: 3 / 4; padding: 0; margin: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #9fb0bd; }
  .frame canvas { width: 100%; height: 100%; display: block; }
  .frame.sel { border: 2px solid #0f6fde; background: #22374d; color: #fff; }
  .frame-cols { display: flex; gap: 6px; margin: 4px 0 8px; }
  .frame-col { flex: 1 1 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .frame-col .frame { flex: 0 0 auto; width: 100%; }
  .confirm-btn { width: 100%; margin: 0; }
  .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .thumbs figure { margin: 0; }
  .thumbs figcaption { font-size: 12px; color: #9fb0bd; margin-top: 4px; line-height: 1.5; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0f6fde; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 50; display: none; white-space: nowrap; }
</style>
</head>
<body>

<main id="page-top">
  <h1>姿勢カメラ V25</h1>
  <button id="btn-perms" class="primary">カメラとセンサーの権限を取る</button>
  <p class="muted">カメラ：<span id="perm-cam">未取得</span>　センサー：<span id="perm-sensor">未取得</span></p>
  <p id="cam-err" class="err"></p>
  <h2>患者の登録</h2>

  <button id="btn-ocr" disabled>カルテを撮って読み取る</button>
  <form id="reg-form">
  <label class="fld-label" for="reg-name">患者名</label>
  <input id="reg-name" type="text" autocomplete="off" enterkeyhint="next">
  <label class="fld-label" for="reg-chart">カルテ番号</label>
  <input id="reg-chart" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done">
  </form>
  <div id="patient-list"></div>
  <button id="btn-start-before" class="primary" disabled>ビフォーを撮る</button>
  <div id="shoot-area"></div>
  <div id="after-area"></div>
  <h2>記録</h2>
  <div id="set-list"></div>
  <p id="list-empty" class="muted">まだありません</p>
</main>

<main id="page-detail" hidden>
  <button id="btn-back-top" class="sub">← 戻る</button>
  <h1 id="detail-title">記録</h1>
  <p id="pitch-note" class="err" hidden></p>
  <div class="thumbs" id="detail-thumbs"></div>
  <button id="btn-lm" class="sub">ポイント・ラインを表示</button>
  <button id="btn-export-json">記録データ（傾き・輪郭）を書き出す</button>
  <button id="btn-delete-set" class="danger">この記録を削除する</button>
</main>

<div id="cam-wrap" hidden>
  <canvas id="cam-canvas"></canvas>
  <div id="cam-top">
    <div id="cam-dir">正面</div>
    <div id="cam-info"></div>
  </div>
  <div id="cam-bottom">
    <button id="shutter" aria-label="撮影"></button>
    <div class="cam-btns">
      <button id="btn-cam-cancel" class="sub">やめる</button>
      <button id="btn-cam-skip" class="sub">撮らない</button>
      <button id="btn-cam-finish" class="sub">ここまでで保存</button>
      <button id="btn-cam-flip" class="sub">カメラ切替</button>
      <button id="btn-cam-grid" class="sub">格子</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const APP_VERSION = 25;
const DIRS = ["front", "right", "left", "back"];
const DIR_JA = { front: "正面", right: "右側面", left: "左側面", back: "背面" };
/* ===== 4枠で撮る（V22） =====
   ビフォーの下にアフターの空枠が並び、枠を押すとその面だけを撮る。
   撮るごとに保存され、写真は人物中心のトリミングで枠に入る。 */
const FRAME_DIRS = ["left", "front", "right", "back"];
let group = { started: false, beforeId: null, patientObj: null };
let sel = { key: "before:draft", kind: "before", setId: null, dir: "front", photoId: null };
async function selectFrame(el) {
  const setId = el.dataset.setid || null;
  const dir = el.dataset.dir;
  const photoId = el.dataset.photoid || null;
  sel = { key: el.dataset.row, kind: el.dataset.kind, setId, dir, photoId };
  if (photoId && setId) {
    await setChosen(setId, dir, photoId);
    await renderShoot();
  } else {
    normalizeSel();
  }
}
function normalizeSel() {
  const frames = Array.from(document.querySelectorAll(".frame"));
  if (!frames.length) return;
  const same = (el) => el.dataset.row === sel.key && el.dataset.dir === sel.dir && (el.dataset.photoid || null) === (sel.photoId || null);
  let cur = frames.find(same);
  if (!cur) {
    cur = frames.find((el) => el.dataset.photoid) || frames[0];
    sel = { key: cur.dataset.row, kind: cur.dataset.kind, setId: cur.dataset.setid || null, dir: cur.dataset.dir, photoId: cur.dataset.photoid || null };
  }
  frames.forEach((el) => el.classList.toggle("sel", el === cur));
  $("btn-start-before").textContent = sel.kind === "after" ? "アフターを撮る" : "ビフォーを撮る";
}
// 患者が変わったら、枠の組もその患者の新しい組に切り替える（前の組の記録は一覧に残る）。
function syncGroupPatient() {
  const pid = group.patientObj ? group.patientObj.id : null;
  const cid = currentPatient ? currentPatient.id : null;
  if (pid === cid) return;
  group = { started: true, beforeId: null, patientObj: currentPatient ? { id: currentPatient.id, name: currentPatient.name, chartNo: currentPatient.chartNo || "" } : null };
  sel = { key: "before:draft", kind: "before", setId: null, dir: "front", photoId: null };
  saveGroupRef();
  renderShoot();
}
function curDir() { return S.single ? S.single.dir : DIRS[S.step]; }
function saveGroupRef() {
  try {
    if (group.beforeId) localStorage.setItem("pc-group", group.beforeId);
    else localStorage.removeItem("pc-group");
  } catch (e) {}
}
async function restoreGroup() {
  let id = null;
  try { id = localStorage.getItem("pc-group"); } catch (e) {}
  if (!id) return;
  const s = await DB.get("sets", id);
  if (!s || s.kind !== "before") return;
  group = { started: true, beforeId: s.id, patientObj: { id: s.patientId, name: s.patient, chartNo: s.chartNo || "" } };
}
function fmtWhen(ts) {
  const d = new Date(ts);
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
// 枠の中身：補正した写真を、人物の範囲を中心に 3:4 で切り取って返す。
function frameCanvas(img, tilt, contour) {
  const cv = correctedCanvas(img, tilt);
  const W = 240, H = 320, asp = W / H;
  let sx = 0, sy = 0, sw = cv.width, sh = cv.height;
  const box = personBox(img, tilt, contour);
  if (box) {
    let tw = (box.x1 - box.x0) * 1.15, th = (box.y1 - box.y0) * 1.15;
    if (tw / th < asp) tw = th * asp; else th = tw / asp;
    if (tw > cv.width) { th *= cv.width / tw; tw = cv.width; }
    if (th > cv.height) { tw *= cv.height / th; th = cv.height; }
    const cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2;
    sx = Math.min(Math.max(cx - tw / 2, 0), Math.max(0, cv.width - tw));
    sy = Math.min(Math.max(cy - th / 2, 0), Math.max(0, cv.height - th));
    sw = tw; sh = th;
  } else {
    if (sw / sh < asp) { const nw = sh * asp; sx = (sw - nw) / 2; sw = nw; }
    else { const nh = sw / asp; sy = (sh - nh) / 2; sh = nh; }
  }
  const out = document.createElement("canvas");
  out.width = W; out.height = H;
  out.getContext("2d").drawImage(cv, sx, sy, sw, sh, 0, 0, W, H);
  return out;
}
function fillFrame(btn, p) {
  const url = URL.createObjectURL(p.blob);
  const img = new Image();
  img.onload = async () => {
    let contour = p.contour || null;
    if (!contour) {
      const raw = document.createElement("canvas");
      raw.width = img.naturalWidth || img.width; raw.height = img.naturalHeight || img.height;
      raw.getContext("2d").drawImage(img, 0, 0);
      contour = await extractContour(raw);
    }
    btn.innerHTML = "";
    btn.appendChild(frameCanvas(img, p.tilt, contour));
    URL.revokeObjectURL(url);
  };
  img.src = url;
}
async function renderShoot() {
  const area = $("shoot-area");
  area.innerHTML = "";
  const rows = [];
  let beforeSet = null;
  if (group.beforeId) beforeSet = await DB.get("sets", group.beforeId);
  rows.push({ kind: "before", set: beforeSet, setId: group.beforeId });
  if (group.beforeId) {
    const afters = (await DB.all("sets")).filter((x) => x.baseSetId === group.beforeId).sort((a, b) => a.createdAt - b.createdAt);
    for (const a of afters) rows.push({ kind: "after", set: a, setId: a.id });
    rows.push({ kind: "after", set: null, setId: null });
  }
  for (const row of rows) {
    const lab = document.createElement("div");
    lab.className = "row-label";
    lab.textContent = (row.kind === "before" ? "ビフォー" : "アフター") + (row.set ? "　" + fmtWhen(row.set.createdAt) : "");
    area.appendChild(lab);
    const cols = document.createElement("div");
    cols.className = "frame-cols";
    const photos = row.setId ? await DB.bySet(row.setId) : [];
    for (const dir of FRAME_DIRS) {
      const col = document.createElement("div");
      col.className = "frame-col";
      const list = photos.filter((x) => x.dir === dir).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const chosen = list.find((x) => x.chosen) || list[list.length - 1] || null;
      col.appendChild(mkFrame(row, dir, chosen));
      if (list.length) {
        for (const p of list) {
          if (chosen && p.id === chosen.id) continue;
          col.appendChild(mkFrame(row, dir, p));
        }
        col.appendChild(mkFrame(row, dir, null));
      }
      if (list.length >= 2) {
        const cf = document.createElement("button");
        cf.className = "sub confirm-btn";
        cf.textContent = "確定";
        cf.onclick = () => confirmDir(row.setId, dir);
        col.appendChild(cf);
      }
      cols.appendChild(col);
    }
    area.appendChild(cols);
  }
  normalizeSel();
}
function mkFrame(row, dir, photo) {
  const f = document.createElement("button");
  f.className = "frame";
  f.dataset.row = row.kind + ":" + (row.setId || "draft");
  f.dataset.kind = row.kind;
  f.dataset.setid = row.setId || "";
  f.dataset.dir = dir;
  f.dataset.photoid = photo ? photo.id : "";
  f.dataset.filled = photo ? "1" : "0";
  if (photo) fillFrame(f, photo); else f.textContent = DIR_JA[dir];
  f.onclick = () => selectFrame(f);
  return f;
}
async function setChosen(setId, dir, photoId) {
  const photos = await DB.bySet(setId);
  for (const p of photos) {
    if (p.dir !== dir) continue;
    const c = p.id === photoId;
    if (!!p.chosen !== c) { p.chosen = c; await DB.put("photos", p); }
  }
}
async function confirmDir(setId, dir) {
  if (!setId) return;
  const photos = await DB.bySet(setId);
  const list = photos.filter((p) => p.dir === dir);
  if (list.length < 2) return;
  const keep = list.find((p) => p.chosen) || list[list.length - 1];
  for (const p of list) if (p.id !== keep.id) await DB.del("photos", p.id);
  if (sel.setId === setId && sel.dir === dir) sel.photoId = keep.id;
  toast("1枚だけ残しました");
  await renderShoot();
  await renderList();
}
async function beginSingle(kind, setId, dir) {
  if (!PERMS.cam) { toast("先に権限を取ってください"); return; }
  if (kind === "after" && !group.beforeId) { toast("先にビフォーを撮ってください"); return; }
  if (kind === "before" && !setId) {
    const nm = $("reg-name").value.trim(), cn = $("reg-chart").value.trim();
    if (nm && cn) await registerPatient();
    if (currentPatient) {
      group.patientObj = { id: currentPatient.id, name: currentPatient.name, chartNo: currentPatient.chartNo || "" };
    }
    if (!group.patientObj) { toast("患者が決まっていません"); return; }
  }
  S.mode = kind; S.single = { kind, setId: setId || null, dir };
  S.landmarks = null; S.basePhotos = {};
  if (kind === "after" && group.beforeId) {
    const ps = await DB.bySet(group.beforeId);
    for (const p of ps) S.basePhotos[p.dir] = p;
  }
  $("page-top").hidden = true; $("page-detail").hidden = true;
  $("cam-wrap").hidden = false;
  $("cam-dir").textContent = DIR_JA[dir] + (kind === "after" ? "（アフター）" : "（ビフォー）");
  $("btn-cam-skip").style.display = "none";
  $("btn-cam-finish").style.display = "none";
  try {
    await startCamera();
  } catch (e) {
    console.warn(e);
    cancelShoot();
    const el = $("cam-err");
    if (el) el.textContent = "カメラを開けませんでした（" + (e && (e.name || e.message) || e) + "）";
    return;
  }
  loadAI();
}
async function saveSingleShot(shot) {
  toast("保存しています…", 4000);
  const sg = S.single; S.single = null;
  let setId = sg.setId;
  if (!setId) {
    setId = uid();
    const po = group.patientObj || currentPatient || { id: null, name: "", chartNo: "" };
    await DB.put("sets", {
      id: setId,
      patientId: po.id || null,
      patient: po.name || "（名前なし）",
      chartNo: po.chartNo || "",
      kind: sg.kind,
      baseSetId: sg.kind === "after" ? group.beforeId : null,
      createdAt: Date.now(), appVersion: APP_VERSION
    });
    if (sg.kind === "before") { group.beforeId = setId; saveGroupRef(); }
  }
  const olds = (await DB.bySet(setId)).filter((p) => p.dir === shot.dir);
  for (const o of olds) if (o.chosen) { o.chosen = false; await DB.put("photos", o); }
  const contour = await extractContour(shot.canvas);
  const blob = await new Promise((res) => shot.canvas.toBlob(res, "image/jpeg", 0.92));
  const photoId = uid();
  await DB.put("photos", {
    id: photoId, setId, dir: shot.dir, blob,
    w: shot.canvas.width, h: shot.canvas.height,
    tilt: shot.tilt, pitch: shot.pitch,
    alpha: shot.alpha, beta: shot.beta, gamma: shot.gamma, contour,
    landmarks: shot.landmarks || null, chosen: true, createdAt: Date.now()
  });
  if (!contour) toast("保存しました（輪郭は取れませんでした）", 4000);
  else toast("保存しました");
  sel = { key: sg.kind + ":" + setId, kind: sg.kind, setId, dir: shot.dir, photoId };
  await renderShoot();
  await renderList();
}

const $ = (id) => document.getElementById(id);
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._h); toast._h = setTimeout(() => { t.style.display = "none"; }, ms || 1800);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ===== 保存 ===== */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("posture-cam", 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains("sets")) d.createObjectStore("sets", { keyPath: "id" });
        if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos", { keyPath: "id" }).createIndex("setId", "setId", { unique: false });
        if (!d.objectStoreNames.contains("patients")) d.createObjectStore("patients", { keyPath: "id" });
      };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  put(store, v) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, "readwrite");
      t.objectStore(store).put(v);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  },
  get(store, k) {
    return new Promise((res, rej) => {
      const rq = DB.db.transaction(store).objectStore(store).get(k);
      rq.onsuccess = () => res(rq.result || null); rq.onerror = () => rej(rq.error);
    });
  },
  all(store) {
    return new Promise((res, rej) => {
      const rq = DB.db.transaction(store).objectStore(store).getAll();
      rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
    });
  },
  bySet(setId) {
    return new Promise((res, rej) => {
      const rq = DB.db.transaction("photos").objectStore("photos").index("setId").getAll(setId);
      rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
    });
  },
  del(store, k) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, "readwrite");
      t.objectStore(store).delete(k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  }
};

/* ===== 傾き ===== */
let orient = { alpha: null, beta: null, gamma: null };
let gotOrientValue = false;
function onOrient(e) {
  orient = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
  if (e.beta != null) gotOrientValue = true;
}
function tiltDeg(o) {
  if (o.beta == null || o.gamma == null) return null;
  const b = o.beta * Math.PI / 180, g = o.gamma * Math.PI / 180;
  const rollScreen = Math.atan2(-Math.cos(b) * Math.sin(g), Math.sin(b)) * 180 / Math.PI;
  // スマホを横向きで構えた時、画面の向きの分だけズレる。縦向きで構えた前提で計算していたのが
  // 「格子は垂直なのに写真が斜め」の原因（V14で画面の向きを差し引く）。
  const so = (typeof screen !== "undefined" && screen.orientation && typeof screen.orientation.angle === "number")
    ? screen.orientation.angle : (typeof window.orientation === "number" ? window.orientation : 0);
  let r = rollScreen - so;
  r = ((r + 540) % 360) - 180;
  // 写真の横方向に対して-90〜90に丸める（±180付近は上下逆さま扱いで0側に寄せる）
  if (r > 90) r -= 180;
  if (r < -90) r += 180;
  return Math.round(r * 10) / 10;
}
function pitchDeg(o) {
  if (o.beta == null) return null;
  return Math.round((o.beta - 90) * 10) / 10;
}
let sensorAsked = false;
/* iOS対策：モーションセンサーの許可要求は、タップされた瞬間に直接呼ばないと
   受け付けられないことがある。そのため要求だけを同期的に発行し、Promiseを返す。 */
function requestSensorPermission() {
  if (sensorAsked) return Promise.resolve(true);
  sensorAsked = true;
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    return DeviceOrientationEvent.requestPermission()
      .then((p) => p === "granted")
      .catch(() => false);
  }
  return Promise.resolve(true);
}
async function finishSensorSetup(granted) {
  if (!granted) return false;
  window.addEventListener("deviceorientation", onOrient, true);
  return true;
}

/* ===== 権限（最初に取る） ===== */
const PERMS = { cam: false, sensor: false };
function updatePermUI() {
  $("perm-cam").textContent = PERMS.cam ? "OK" : "未取得";
  $("perm-sensor").textContent = PERMS.sensor ? "OK" : "未取得";
  $("btn-ocr").disabled = !PERMS.cam;
  // 直接書き込んだ場合、登録は「ビフォーを撮る」を押した時に行う。登録済みでないと押せない作りは行き止まりになる（V12で修正）。
  $("btn-start-before").disabled = !PERMS.cam;
  $("btn-perms").disabled = PERMS.cam && PERMS.sensor;
}
async function takePerms() {
  // iOS対策：センサー許可の要求は、タップの最初に直接発行する（カメラより先）
  const sensorReq = requestSensorPermission();
  // カメラ：許可を取るだけ（ストリームはすぐ止める。撮影時に改めて開く）
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    st.getTracks().forEach((t) => t.stop());
    PERMS.cam = true;
  } catch (e) {
    console.warn(e);
    $("perm-cam").textContent = "許可されませんでした";
  }
  // モーションセンサー：許可＋値が実際に来るかまで確認
  const asked = await finishSensorSetup(await sensorReq);
  if (asked) {
    const t0 = Date.now();
    while (!gotOrientValue && Date.now() - t0 < 1500) {
      await new Promise((r) => setTimeout(r, 100));
    }
    PERMS.sensor = gotOrientValue;
    if (!PERMS.sensor) $("perm-sensor").textContent = "値が取れませんでした";
  } else {
    $("perm-sensor").textContent = "許可されませんでした";
  }
  updatePermUI();
  await renderList();
  if (PERMS.cam) { toast("権限を取りました"); loadAI(); }
}
if (typeof DeviceOrientationEvent === "undefined" || typeof DeviceOrientationEvent.requestPermission !== "function") {

}

/* カルテ撮影→OCR。読み取りは端末内（Tesseract）で行う。名前と番号が揃えば、そのまま登録する（V7で登録ボタンを廃止）。 */
let tesseractLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js";
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return tesseractLoading;
}
function parseChartText(text) {
  const lines = String(text).split(/\n/).map((l) => l.trim()).filter(Boolean);
  let chartNo = "";
  const m = text.match(/(?:No\.?|番号|カルテ|ID)[:：\s]*([0-9][0-9\-]{2,})/i);
  if (m) chartNo = m[1].replace(/-/g, "");
  if (!chartNo) {
    const nums = text.match(/[0-9]{4,}/g);
    if (nums) chartNo = nums.sort((a, b) => b.length - a.length)[0];
  }
  let name = "";
  const nm = text.match(/(?:氏名|名前|患者名)[:：\s]*([^\n\d]{2,})/);
  if (nm) name = nm[1].trim();
  if (!name) {
    const cand = lines.filter((l) => /[ぁ-んァ-ヶ一-龥]/.test(l) && !/(カルテ|番号|氏名|名前|患者|診療|歯科|医院|様式|No)/i.test(l))
      .sort((a, b) => b.length - a.length)[0];
    if (cand) name = cand.replace(/[\s　]+/g, "");
  }
  name = name.replace(/様$/, "").trim();
  return { name, chartNo };
}
async function runOcr(canvas) {
  toast("読み取っています…", 6000);
  try {
    await loadTesseract();
    const { data } = await window.Tesseract.recognize(canvas, "jpn");
    const r = parseChartText(data.text || "");
    if (r.name) $("reg-name").value = r.name;
    if (r.chartNo) $("reg-chart").value = r.chartNo;
    if (r.name && r.chartNo) {
      await registerPatient();
    } else {
      toast(r.name || r.chartNo ? "一部だけ読み取りました。足りない欄を入れてください" : "読み取れませんでした");
    }
  } catch (e) {
    console.warn(e);
    toast("読み取れませんでした");
  }
}

/* ===== AI（後から読み込む。失敗しても撮影はできる） ===== */
let MP = null, pose = null, seg = null, aiState = "";
let lastPoseTs = 0;
let aiLoading = null;
async function loadAI() {
  if (pose && seg) return;
  if (aiLoading) return aiLoading;
  aiState = "姿勢ポイント準備中…";
  aiLoading = (async () => {
    let vision = null;
    try {
      if (!MP) {
        try { MP = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"); }
        catch (e) { MP = await import("https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"); }
      }
      vision = await MP.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    } catch (e) {
      console.warn("AI土台の読込:", e);
      aiState = "姿勢ポイントは使えません";
      aiLoading = null;
      return;
    }
    // 骨格と輪郭は別々に作る。片方が失敗しても、もう片方を巻き込まない（V17）。
    try {
      if (!pose) {
        const poseOpts = (delegate) => ({
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate },
          runningMode: "VIDEO", numPoses: 1
        });
        try { pose = await MP.PoseLandmarker.createFromOptions(vision, poseOpts("GPU")); }
        catch (e) {
          console.warn("GPUで姿勢解析を作れず、CPUで再試行:", e);
          try { pose = await MP.PoseLandmarker.createFromOptions(vision, poseOpts("CPU")); }
          catch (e2) { console.warn("姿勢解析の作成に失敗:", e2); }
        }
      }
      aiState = pose ? "" : "姿勢ポイントは使えません";
      if (!seg) {
        // 輪郭用はGPUで作れなかったらCPUでも試す（片方だけ試して諦める作りだったのが、輪郭なしの原因候補）。
        const segOpts = (delegate) => ({
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite", delegate },
          runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: false
        });
        try { seg = await MP.ImageSegmenter.createFromOptions(vision, segOpts("GPU")); }
        catch (e) {
          console.warn("GPUで輪郭用AIを作れず、CPUで再試行:", e);
          try { seg = await MP.ImageSegmenter.createFromOptions(vision, segOpts("CPU")); }
          catch (e2) { console.warn("輪郭用AI読込:", e2); }
        }
      }
    } catch (e) {
      console.warn("AI読込:", e);
      if (!pose) aiState = "姿勢ポイントは使えません";
    }
    aiLoading = null;
  })();
  return aiLoading;
}

function contourFromMask(mask, w, h) {
  let cx = 0, cy = 0, n = 0;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
    if (mask[y * w + x] > 0) { cx += x; cy += y; n++; }
  }
  if (n < w * h * 0.02) return null;
  cx /= n; cy /= n;
  const RAYS = 180, pts = [];
  for (let i = 0; i < RAYS; i++) {
    const a = (i / RAYS) * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    let last = null;
    for (let r = 0; r < Math.max(w, h); r += 2) {
      const x = Math.round(cx + dx * r), y = Math.round(cy + dy * r);
      if (x < 0 || y < 0 || x >= w || y >= h) break;
      if (mask[y * w + x] > 0) last = [x / w, y / h];
    }
    if (last) pts.push(last);
  }
  if (pts.length < RAYS * 0.6) return null;
  return pts.map((p, i) => {
    const q = pts[(i + 1) % pts.length], r = pts[(i + pts.length - 1) % pts.length];
    return [(p[0] + q[0] + r[0]) / 3, (p[1] + q[1] + r[1]) / 3];
  });
}
async function extractContour(canvas) {
  // 輪郭用のAIがまだ来ていない時は、ここで読み込みを待ってから取る（黙って「輪郭なし」にしない）。
  if (!seg) { try { await loadAI(); } catch (e) { /* 取れなければ null */ } }
  if (!seg) return null;
  try {
    const sc = Math.min(1, 640 / canvas.width);
    const c = document.createElement("canvas");
    c.width = Math.round(canvas.width * sc); c.height = Math.round(canvas.height * sc);
    c.getContext("2d").drawImage(canvas, 0, 0, c.width, c.height);
    const result = seg.segment(c);
    if (!result || !result.categoryMask) return null;
    return contourFromMask(result.categoryMask.getAsUint8Array(), result.categoryMask.width, result.categoryMask.height);
  } catch (e) { console.warn("輪郭:", e); return null; }
}

/* ===== 撮影 ===== */
const S = {
  mode: null, patient: "", baseSetId: null, basePhotos: {},
  step: 0, shots: [], single: null, stream: null, video: null, raf: 0,
  landmarks: null, facing: "environment", busy: false, gridMode: 0
};
function coverTransform(vw, vh, cw, ch) {
  const s = Math.max(cw / vw, ch / vh);
  return { s, ox: (cw - vw * s) / 2, oy: (ch - vh * s) / 2 };
}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("no-camera-api");
  }
  if (!S.video) {
    S.video = document.createElement("video");
    S.video.playsInline = true; S.video.muted = true;
    S.video.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;";
    $("cam-wrap").appendChild(S.video);
  }
  // 端末によっては希望サイズ付きだと開けないことがあるので、素の指定へ順に落とす。
  const tries = [
    { video: { facingMode: S.facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: S.facing }, audio: false },
    { video: true, audio: false }
  ];
  let lastErr = null;
  for (const c of tries) {
    try { S.stream = await navigator.mediaDevices.getUserMedia(c); lastErr = null; break; }
    catch (e) { lastErr = e; }
  }
  if (!S.stream) throw lastErr || new Error("camera-failed");
  S.video.srcObject = S.stream;
  try { await S.video.play(); } catch (e) { /* 描画側で再試行する */ }
  requestAnimationFrame(drawLoop);
}
function stopCamera() {
  cancelAnimationFrame(S.raf);
  if (S.stream) S.stream.getTracks().forEach((t) => t.stop());
  S.stream = null;
}
function drawLoop() {
  S.raf = requestAnimationFrame(drawLoop);
  const v = S.video, cv = $("cam-canvas");
  if (!v || v.readyState < 2) return;
  const cw = Math.round(cv.clientWidth * devicePixelRatio), ch = Math.round(cv.clientHeight * devicePixelRatio);
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
  const ctx = cv.getContext("2d");
  const vw = v.videoWidth, vh = v.videoHeight;
  const { s, ox, oy } = coverTransform(vw, vh, cw, ch);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(v, ox, oy, vw * s, vh * s);

  // 画角を決めるための格子（撮影画面に重ねるだけ。写真には焼き込まない）。AI不要で常に出る。
  if (S.gridMode > 0) {
    const divs = S.gridMode === 1 ? 12 : 6;
    ctx.strokeStyle = "rgba(255,255,255,0.30)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < divs; i++) {
      const gx = Math.round(cw * i / divs) + 0.5, gy = Math.round(ch * i / divs) + 0.5;
      ctx.moveTo(gx, 0); ctx.lineTo(gx, ch);
      ctx.moveTo(0, gy); ctx.lineTo(cw, gy);
    }
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,213,74,0.65)";
    ctx.beginPath();
    ctx.moveTo(Math.round(cw / 2) + 0.5, 0); ctx.lineTo(Math.round(cw / 2) + 0.5, ch);
    ctx.stroke();
  }

  if (pose) {
    try {
      const nowTs = performance.now();
      if (nowTs > lastPoseTs) {
        lastPoseTs = nowTs;
        const r = pose.detectForVideo(v, nowTs);
        S.landmarks = (r && r.landmarks && r.landmarks[0]) || null;
      }
    } catch (e) { S.landmarks = null; }
  }
  if (S.landmarks && MP) {
    ctx.strokeStyle = "rgba(64,200,255,.9)"; ctx.fillStyle = "rgba(255,220,64,.95)";
    ctx.lineWidth = Math.max(2, cw * 0.004);
    const P = (p) => [ox + p.x * vw * s, oy + p.y * vh * s];
    const CONN = MP.PoseLandmarker.POSE_CONNECTIONS ||
      [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[0,11],[0,12]].map(([a, b]) => ({ start: a, end: b }));
    ctx.beginPath();
    for (const c of CONN) {
      const a = S.landmarks[c.start], b = S.landmarks[c.end];
      if (!a || !b) continue;
      const [ax, ay] = P(a), [bx, by] = P(b);
      ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
    }
    ctx.stroke();
    for (const p of S.landmarks) {
      const [x, y] = P(p);
      ctx.beginPath(); ctx.arc(x, y, Math.max(3.5, cw * 0.007), 0, Math.PI * 2); ctx.fill();
    }
  }

  const base = S.mode === "after" ? S.basePhotos[curDir()] : null;
  if (base && base.contour && base.contour.length > 2) {
    const bw = base.w || vw, bh = base.h || vh;
    const t2 = coverTransform(bw, bh, cw, ch);
    ctx.strokeStyle = "rgba(255,120,160,.95)";
    ctx.lineWidth = Math.max(2.5, cw * 0.006);
    ctx.beginPath();
    base.contour.forEach((p, i) => {
      const x = t2.ox + p[0] * bw * t2.s, y = t2.oy + p[1] * bh * t2.s;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath(); ctx.stroke();
  }

  const t = tiltDeg(orient);
  let info = "傾き " + (t == null ? "—" : t.toFixed(1) + "°") + (aiState ? "　" + aiState : "");
  // アフター撮影で、その方向のビフォー輪郭が無い時は画面に出す（黙って何も出ない形にしない）。
  if (S.mode === "after") {
    const bp = S.basePhotos[curDir()];
    if (!bp || !bp.contour) info += "　輪郭なし";
  }
  $("cam-info").textContent = info;
}

async function beginShoot(mode, baseSetId, patientObj) {
  if (!PERMS.cam) { toast("先に権限を取ってください"); return; }
  S.mode = mode; S.baseSetId = baseSetId || null;
  S.patientObj = patientObj || null;
  S.patient = patientObj ? patientObj.name : "";
  S.step = 0; S.shots = []; S.landmarks = null; S.basePhotos = {};
  if (mode === "after" && baseSetId) {
    const ps = await DB.bySet(baseSetId);
    for (const p of ps) S.basePhotos[p.dir] = p;
  }
  $("page-top").hidden = true; $("page-detail").hidden = true;
  $("cam-wrap").hidden = false;
  updateCamDir();
  try {
    await startCamera();
  } catch (e) {
    console.warn(e);
    cancelShoot();
    const el = $("cam-err");
    if (el) el.textContent = "カメラを開けませんでした（" + (e && (e.name || e.message) || e) + "）";
    return;
  }
  loadAI();
}
function updateCamDir() {
  $("btn-cam-skip").style.display = "";
  $("btn-cam-finish").style.display = "";
  if (S.mode === "ocr") {
    $("cam-dir").textContent = "カルテの名前と番号を写す";
    $("btn-cam-finish").disabled = true;
    return;
  }
  $("cam-dir").textContent = (S.step + 1) + " / 4　" + DIR_JA[DIRS[S.step]] + (S.mode === "after" ? "（アフター）" : "（ビフォー）");
  $("btn-cam-finish").disabled = S.shots.length === 0;
}
function cancelShoot() {
  S.single = null;
  stopCamera();
  $("cam-wrap").hidden = true;
  $("page-top").hidden = false;
}
async function nextStep() {
  S.step++;
  if (S.step >= 4) { await finishShoot(); return; }
  updateCamDir();
}
async function takePhoto() {
  if (S.busy || !S.video || S.video.readyState < 2) return;
  S.busy = true;
  try {
    const v = S.video;
    const c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    if (S.mode === "ocr") {
      stopCamera();
      $("cam-wrap").hidden = true;
      $("page-top").hidden = false;
      await runOcr(c);
      return;
    }
    if (S.single) {
      const shot = {
        dir: S.single.dir, canvas: c,
        tilt: tiltDeg(orient), pitch: pitchDeg(orient),
        alpha: orient.alpha, beta: orient.beta, gamma: orient.gamma,
        landmarks: S.landmarks ? S.landmarks.map((p) => [Math.round(p.x * 10000) / 10000, Math.round(p.y * 10000) / 10000]) : null
      };
      stopCamera();
      $("cam-wrap").hidden = true;
      $("page-top").hidden = false;
      await saveSingleShot(shot);
      return;
    }
    S.shots.push({
      dir: DIRS[S.step], canvas: c,
      tilt: tiltDeg(orient), pitch: pitchDeg(orient),
      alpha: orient.alpha, beta: orient.beta, gamma: orient.gamma
    });
    toast(DIR_JA[DIRS[S.step]] + "を撮りました");
    await nextStep();
  } finally { S.busy = false; }
}
async function finishShoot() {
  if (!S.shots.length) { cancelShoot(); return; }
  stopCamera();
  $("cam-wrap").hidden = true;
  toast("保存しています…", 4000);
  const setId = uid();
  await DB.put("sets", {
    id: setId,
    patientId: S.patientObj ? S.patientObj.id : null,
    patient: S.patient || "（名前なし）",
    chartNo: S.patientObj ? S.patientObj.chartNo : "",
    kind: S.mode,
    baseSetId: S.baseSetId, createdAt: Date.now(), appVersion: APP_VERSION
  });
  let contourMiss = false;
  for (const shot of S.shots) {
    let contour = null;
    if (S.mode === "before") { contour = await extractContour(shot.canvas); if (!contour) contourMiss = true; }
    const blob = await new Promise((res) => shot.canvas.toBlob(res, "image/jpeg", 0.92));
    await DB.put("photos", {

// 傾きから90°の倍数を差し引いて、-45〜45°に収めた値を返す（V20）。
// iPadでは画面の向きの差し引きが90°ずれることがあり、傾きが90°近くに化ける。
// 写真そのものは縦向きのままなので、90°分は化けた分として捨て、残りだけで補正する。
function splitTilt(tilt) {
  const t = tilt || 0;
  let q = Math.round(t / 90);
  if (q > 1) q = 1; if (q < -1) q = -1;
  return { q, rem: t - q * 90 };
}
function correctedCanvas(img, tilt) {
  const rem = splitTilt(tilt).rem;
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const ang = -rem * Math.PI / 180;
  const t = Math.abs(ang), cos = Math.cos(t), sin = Math.sin(t);
  const rot = document.createElement("canvas");
  rot.width = Math.round(w * cos + h * sin); rot.height = Math.round(w * sin + h * cos);
  const rctx = rot.getContext("2d");
  rctx.translate(rot.width / 2, rot.height / 2); rctx.rotate(ang);
  rctx.drawImage(img, -w / 2, -h / 2);
  // 回転で生じる余白（隅の欠け）を切り落とし、中に収まる最大の長方形に整える
  let cw = w, ch = h;
  const det = cos * cos - sin * sin;
  if (sin > 0.0001 && det > 0.2) {
    const x = ((w / 2) * cos - (h / 2) * sin) / det;
    const y = ((h / 2) * cos - (w / 2) * sin) / det;
    if (x > 10 && y > 10) { cw = Math.floor(2 * x); ch = Math.floor(2 * y); }
  }
  const out = document.createElement("canvas");
  out.width = cw; out.height = ch;
  out.getContext("2d").drawImage(rot, (rot.width - cw) / 2, (rot.height - ch) / 2, cw, ch, 0, 0, cw, ch);
  return out;
}
// 輪郭（元の写真に対する 0〜1 の点列）を、傾き補正後のキャンバス座標での人の範囲に変換する（V19）。
function personBox(img, tilt, contour) {
  if (!contour || contour.length < 3) return null;
  const rem = splitTilt(tilt).rem;
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const ang = -rem * Math.PI / 180;
  const t = Math.abs(ang), cos = Math.cos(t), sin = Math.sin(t);
  const rotW = Math.round(w * cos + h * sin), rotH = Math.round(w * sin + h * cos);
  let cw = w, ch = h;
  const det = cos * cos - sin * sin;
  if (sin > 0.0001 && det > 0.2) {
    const x = ((w / 2) * cos - (h / 2) * sin) / det;
    const y = ((h / 2) * cos - (w / 2) * sin) / det;
    if (x > 10 && y > 10) { cw = Math.floor(2 * x); ch = Math.floor(2 * y); }
  }
  const offX = (rotW - cw) / 2, offY = (rotH - ch) / 2;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of contour) {
    const cx = p[0] * w - w / 2, cy = p[1] * h - h / 2;
    const rx = cx * ca - cy * sa, ry = cx * sa + cy * ca;
    const X = rx + rotW / 2 - offX, Y = ry + rotH / 2 - offY;
    if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
  }
  if (!(x1 > x0 && y1 > y0)) return null;
  return { x0, y0, x1, y1 };
}
// 人の高さと頭の位置を左右で揃えた表示用キャンバスを返す（V19）。
function alignedPair(cvB, boxB, cvA, boxA) {
  const phB = boxB.y1 - boxB.y0, phA = boxA.y1 - boxA.y0;
  const PH = Math.max(phB, phA);
  const sB = PH / phB, sA = PH / phA;
  const head = Math.round(PH * 0.05);
  const OW = Math.round(Math.max(cvB.width * sB, cvA.width * sA));
  const oyB = head - boxB.y0 * sB, oyA = head - boxA.y0 * sA;
  const OH = Math.round(Math.max(cvB.height * sB + oyB, cvA.height * sA + oyA));
  const mk = (cv, s, box, oy) => {
    const out = document.createElement("canvas"); out.width = OW; out.height = OH;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, OW, OH);
    const ox = OW / 2 - ((box.x0 + box.x1) / 2) * s;
    ctx.drawImage(cv, ox, oy, cv.width * s, cv.height * s);
    out._tf = { s, ox, oy };
    return out;
  };
  return [mk(cvB, sB, boxB, oyB), mk(cvA, sA, boxA, oyA)];
}
// 輪郭が無い時は、写真の高さだけを揃える（V19）。
function equalHeightPair(cvB, cvA) {
  const OH = Math.max(cvB.height, cvA.height);
  const sB = OH / cvB.height, sA = OH / cvA.height;
  const OW = Math.round(Math.max(cvB.width * sB, cvA.width * sA));
  const mk = (cv, s) => {
    const out = document.createElement("canvas"); out.width = OW; out.height = OH;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, OW, OH);
    ctx.drawImage(cv, (OW - cv.width * s) / 2, 0, cv.width * s, cv.height * s);
    out._tf = { s, ox: (OW - cv.width * s) / 2, oy: 0 };
    return out;
  };
  return [mk(cvB, sB), mk(cvA, sA)];
}
function loadImg(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = (e) => { URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
function downloadBlob(blob, name) {
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
function fileBase() {

}
// 複数枚ある面は、本命（chosen）の1枚だけを返す。無ければ最新の1枚。
function pickChosen(list) {
  const byDir = {};
  const sorted = [...list].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  for (const p of sorted) {
    const cur = byDir[p.dir];
    if (!cur || p.chosen || !cur.chosen) byDir[p.dir] = p;
  }
  return Object.values(byDir);
}
// ランドマークの点（元の写真に対する0〜1）を、傾き補正後のキャンバス座標に移す。
function correctedPoint(x, y, w, h, tilt) {
  const rem = splitTilt(tilt).rem;
  const ang = -rem * Math.PI / 180;
  const t = Math.abs(ang), cos = Math.cos(t), sin = Math.sin(t);
  const rotW = Math.round(w * cos + h * sin), rotH = Math.round(w * sin + h * cos);
  let cw = w, ch = h;
  const det = cos * cos - sin * sin;
  if (sin > 0.0001 && det > 0.2) {
    const xx = ((w / 2) * cos - (h / 2) * sin) / det;
    const yy = ((h / 2) * cos - (w / 2) * sin) / det;
    if (xx > 10 && yy > 10) { cw = Math.floor(2 * xx); ch = Math.floor(2 * yy); }
  }
  const offX = (rotW - cw) / 2, offY = (rotH - ch) / 2;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const cx = x * w - w / 2, cy = y * h - h / 2;
  const rx = cx * ca - cy * sa, ry = cx * sa + cy * ca;
  return [rx + rotW / 2 - offX, ry + rotH / 2 - offY];
}
const LM_CONN = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[0,11],[0,12]];
// 写真とは別のレイヤーとして、ポイントとラインを表示用キャンバスの上に描く。
function drawLandmarks(cv, p) {
  if (!p.landmarks || !p.landmarks.length || !p.w || !p.h) return;
  const tf = cv._tf || { s: 1, ox: 0, oy: 0 };
  const pts = p.landmarks.map((lm) => {
    const c = correctedPoint(lm[0], lm[1], p.w, p.h, p.tilt);
    return [c[0] * tf.s + tf.ox, c[1] * tf.s + tf.oy];
  });
  const ctx = cv.getContext("2d");
  ctx.strokeStyle = "rgba(64,200,255,.9)";
  ctx.fillStyle = "rgba(255,220,64,.95)";
  ctx.lineWidth = Math.max(2, cv.width * 0.004);
  ctx.beginPath();
  for (const c of LM_CONN) {
    const a = pts[c[0]], b = pts[c[1]];
    if (!a || !b) continue;
    ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
  }
  ctx.stroke();
  for (const pt of pts) {
    ctx.beginPath(); ctx.arc(pt[0], pt[1], Math.max(3, cv.width * 0.006), 0, Math.PI * 2); ctx.fill();
  }
}

}
async function fetchCommittedFile(sha) {
  const url = "https://raw.githubusercontent.com/" + UPD_REPO + "/" + sha + "/" + UPD_FILE;
  const res = await updFetch(url);
  if (!res.ok) throw new Error("最新版ファイルを取得できませんでした");
  return res.text();
}
async function fetchServedVersion() {
  const url = UPD_PAGES + "?updcheck=" + Date.now();
  const res = await updFetch(url, 15000);
  if (!res.ok) throw new Error("公開ページを確認できませんでした");
  return parseVersion(await res.text());
}
function renderUpdate() {
  const btn = $("btn-update");
  if (!btn) return;
  if (updState.applying) {
    btn.disabled = true;
    btn.textContent = "最新版へ切り替え中…";
    updMsg("キャッシュを消して、最新版を開き直しています。");
    return;
  }
  btn.disabled = false;
  if (updState.latest && updState.latest > APP_VERSION) {
    btn.textContent = "最新版 V" + updState.latest + " に変更（キャッシュを避けて再読み込み）";
    updMsg("新しい版 V" + updState.latest + " があります。今は V" + APP_VERSION + " です。");
  } else {
    btn.textContent = "最新版に変更（キャッシュを避けて再読み込み）";
    if (updState.error) updMsg(updState.error);
    else if (updState.checkedAt) updMsg("最新版を確認済みです（現在 V" + APP_VERSION + "）。");
    else updMsg("公開ページの最新版を確認します。");
  }
}
async function checkUpdate(userInitiated) {
  if (updState.checking || updState.applying) return;
  updState.checking = true;
  updState.userInitiated = !!userInitiated;
  updState.error = "";
  if (userInitiated) updMsg("最新版を確認しています…");
  try {
    const commit = await fetchLatestCommit();
    const latest = parseVersion(await fetchCommittedFile(commit.sha));
    if (!latest) throw new Error("最新版の番号を確認できませんでした");
    updState.latest = latest;
    updState.sha = commit.sha;
    const firstCheck = !updState.checkedAt;
    updState.checkedAt = Date.now();
    if (latest > APP_VERSION) {
      // 更新の表示は出さない（秀司の指示）。開いた直後の確認で新しい版があれば、黙って切り替える。
      if (userInitiated || firstCheck) await applyLatest();
    } else if (userInitiated) {
      updMsg("いま開いているのが最新版です（V" + APP_VERSION + "）。");
    }
  } catch (e) {
    console.error(e);
    updState.error = userInitiated ? "最新版を確認できませんでした。通信状態を確認して、もう一度押してください。" : "";
  } finally {
    updState.checking = false;
    if (!updState.applying) renderUpdate();
  }
}
async function applyLatest() {
  if (updState.applying) return;
  if (S.stream || S.busy) { updMsg("撮影中は切り替えられません。撮影を終えてから押してください。"); return; }
  updState.applying = true;
  renderUpdate();
  try {
    const latest = updState.latest;
    const sha = updState.sha || (await fetchLatestCommit()).sha;
    let served = null;
    for (let i = 0; i < 6; i++) {
      served = await fetchServedVersion().catch(() => null);
      if (served && served >= latest) break;
      if (i < 5) await new Promise((r) => setTimeout(r, 5000));
    }
    if (!served || served < latest) {
      updState.applying = false;
      updMsg("新しい版はまだ公開ページへ反映されていません。少し待ってから、もう一度押してください。");
      renderUpdate();
      return;
    }
    try { sessionStorage.setItem(UPD_TARGET_KEY, JSON.stringify({ version: latest, sha, at: Date.now() })); } catch (e) {}
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    const url = new URL(location.href);
    url.searchParams.set("v", String(latest));
    url.searchParams.set("c", String(sha).slice(0, 12));
    url.searchParams.set("t", String(Date.now()));
    location.replace(url.toString());
  } catch (e) {
    console.error(e);
    updState.applying = false;
    updMsg("切り替えに失敗しました。もう一度押してください。");
    renderUpdate();
  }
}
const updBtn = $("btn-update");
if (updBtn) updBtn.onclick = () => { checkUpdate(true); };

(async () => {
  await DB.open();
  const savedId = localStorage.getItem("pc-patient");
  if (savedId) currentPatient = await DB.get("patients", savedId);
  await renderPatients();
  updatePermUI();
  await renderList();
  await restoreGroup();
  await renderShoot();
  renderUpdate();
  checkUpdate(false);
  setInterval(() => { checkUpdate(false); }, UPDATE_EVERY_MS);
})();
</script>
